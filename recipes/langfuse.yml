summary: Operate self-hosted Langfuse v4 on six AWS or Vultr machines in one VPC, with a Neon storage tier for Postgres, Redis, three ClickHouse replicas with Keeper, and an application host behind Caddy and Cloudflare. Amazon S3 or Cloudflare R2 stores events, media, Neon layers and WAL, and backups with a restore-and-boot rehearsal.
