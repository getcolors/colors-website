name: Redis Operator
repository: getcolors/redis-operator
shape: operator
summary: Install a Kubernetes controller in Green, Red or Blue into an existing cluster that provisions one Redis 7.2 Droplet on DigitalOcean from a RedisDeployment custom resource, heals confirmed Droplet loss, and ships backup rehearsal, recovery drill and controller restart verbs.
keywords:
  - Kubernetes operator
  - controller
  - custom resource
  - CRD
  - Redis
  - DigitalOcean
  - Droplet
  - self-healing
  - backup
  - DOKS
  - green.kubernetes
  - red.kubernetes
  - blue.kubernetes
  - operator pattern
featured: /featured#redis-operator
artifacts:
  - name: RedisDeployment CustomResourceDefinition
    path: src/resources/io/github/getcolors/redis_operator/crd.yml
    note: Applied by create; the schema every RedisDeployment must satisfy.
  - name: Controller image
    path: Dockerfile
    note: Built for linux/amd64 by scripts/image.sh, pushed to the deployment's registry and pinned by digest as `image` in colors.yml.
  - name: Controller Deployment, RBAC and PersistentVolumeClaim
    note: Rendered by build into .colors/<profile>/operator/manifests.json; the volume keeps SSH keys, the convergence record and dependency caches.
  - name: RedisDeployment custom resource
    note: Rendered from colors.yml into .colors/<profile>/operator/redis-deployment.json and applied last, after the controller has rolled out.
package-skills:
  - name: package-redis-operator-green
    path: skills/package-redis-operator-green/SKILL.md
    runtime: green
  - name: package-redis-operator-red
    path: skills/package-redis-operator-red/SKILL.md
    runtime: red
  - name: package-redis-operator-blue
    path: skills/package-redis-operator-blue/SKILL.md
    runtime: blue
