<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <!--
    The Colors mark: reused directly by the shared SiteHeader navigation.
    Colours are the sRGB equivalents of the page's
    oklch() accents, written as hex so every favicon rasteriser agrees:
      red   oklch(60% 0.19 25)  -> #db4241
      green oklch(65% 0.17 145) -> #3ba946
      blue  oklch(55% 0.18 260) -> #296cd8
    Green is painted full-bleed underneath so the thirds cannot show a
    seam when the icon is scaled down to 16px.
  -->
  <title>Colors</title>
  <clipPath id="rounded">
    <rect width="20" height="20" rx="4" />
  </clipPath>
  <g clip-path="url(#rounded)">
    <rect width="20" height="20" fill="#3ba946" />
    <rect width="6.667" height="20" fill="#db4241" />
    <rect x="13.333" width="6.667" height="20" fill="#296cd8" />
  </g>
</svg>
